{% extends 'layout.html' %}
{% block title %}{{ book.title }}{% endblock %}
{% block content %}
<a href="{% url 'book_list' %}" class="back-btn">← Back</a>
<div class="detail-card">
  {% if book.image %}<img src="{{ book.image.url }}" alt="{{ book.title }}">{% endif %}
  <h1>{{ book.title }}</h1>
  <p class="author">by {{ book.author }}</p>
  <span class="pill">Rs {{ book.price }}</span>
  <p class="desc">{{ book.description }}</p>
</div>
{% endblock %}
